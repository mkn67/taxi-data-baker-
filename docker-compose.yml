version: '3.8'

services:
  spark-master:
    image: docker.io/bitnamilegacy/spark:3.5.6
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master Port
    cpus: 1.0
    mem_limit: 1024m
    volumes:
      - ./data:/opt/bitnami/spark/data:z
      - ./scripts:/opt/bitnami/spark/scripts:z

  spark-worker-1:
    image: docker.io/bitnamilegacy/spark:3.5.6
    container_name: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2048M
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    ports:
      - "8081:8081"   # Worker 1 Web UI
    cpus: 2.0
    mem_limit: 2560m   # Giới hạn 2.5GB RAM bằng cgroups
    volumes:
      - ./data:/opt/bitnami/spark/data:z
      - ./scripts:/opt/bitnami/spark/scripts:z
    depends_on:
      - spark-master

  spark-worker-2:
    image: docker.io/bitnamilegacy/spark:3.5.6
    container_name: spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2048M
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    ports:
      - "8082:8081"   # Worker 2 Web UI (port nội bộ container là 8081)
    cpus: 2.0
    mem_limit: 2560m   # Giới hạn 2.5GB RAM bằng cgroups
    volumes:
      - ./data:/opt/bitnami/spark/data:z
      - ./scripts:/opt/bitnami/spark/scripts:z
    depends_on:
      - spark-master

  spark-driver:
    image: docker.io/bitnamilegacy/spark:3.5.6
    container_name: spark-driver
    command: ["sleep", "infinity"]
    ports:
      - "4040:4040"   # Spark Application UI khi nộp job
    cpus: 2.0
    mem_limit: 2048m   # Khống chế 2GB RAM riêng cho tiến trình Driver
    volumes:
      - ./data:/opt/bitnami/spark/data:z
      - ./scripts:/opt/bitnami/spark/scripts:z
    depends_on:
      - spark-master

  airflow-standalone:
    image: docker.io/apache/airflow:2.9.0-python3.10
    container_name: airflow-standalone
    command: standalone
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    ports:
      - "8085:8080"   # Tránh trùng port 8080 với Spark Master Web UI
    cpus: 1.5
    mem_limit: 1536m
    userns_mode: "keep-id:uid=50000,gid=0"
    volumes:
      - ./dags:/opt/airflow/dags:z
      - ./data:/opt/airflow/data:z